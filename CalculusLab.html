<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CalculusLab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sibling of Span Lab. Sidebar of rooms (learn / precalculus / calculus); each tool = plot left, instrument panel right */
:root{
  --bg:#f3f5f9;--panel:#ffffff;--ink:#141829;--muted:#596074;--faint:#868ca0;
  --line:#dde1ea;--line2:#c3c9d6;--accent:#3443c4;--accent-bg:#e7e9fb;
  --ok:#1d7442;--ok-bg:#e1f3e8;--bad:#b42318;--bad-bg:#fbe9e7;--grid:#e5e8ef;--axis:#a5acbd;--hl:#fff2cc;
  --v1:#5a4ed4;--v2:#0f8a72;--v3:#cf5226;--v4:#bf3876;--v5:#a8740c;
  --display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f121a;--panel:#171b26;--ink:#e7e9f1;--muted:#a1a7b8;--faint:#7a8094;
  --line:#272d3c;--line2:#384055;--accent:#8e98ff;--accent-bg:#222852;
  --ok:#72d49c;--ok-bg:#153424;--bad:#f97066;--bad-bg:#3a1b19;--grid:#222736;--axis:#4a5267;--hl:#3a3218;
  --v1:#9b91ff;--v2:#3ccaa5;--v3:#f2845c;--v4:#ef72aa;--v5:#e2b443;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f121a;--panel:#171b26;--ink:#e7e9f1;--muted:#a1a7b8;--faint:#7a8094;
  --line:#272d3c;--line2:#384055;--accent:#8e98ff;--accent-bg:#222852;
  --ok:#72d49c;--ok-bg:#153424;--bad:#f97066;--bad-bg:#3a1b19;--grid:#222736;--axis:#4a5267;--hl:#3a3218;
  --v1:#9b91ff;--v2:#3ccaa5;--v3:#f2845c;--v4:#ef72aa;--v5:#e2b443;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font:400 44px/1 var(--display);margin:0;letter-spacing:-0.01em}
h1 em{color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0;max-width:64ch}
h2{font:500 12px/1.2 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
h3{font:400 24px/1.15 var(--display);margin:0;text-wrap:balance}
button{font:500 13px/1 var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--ink)}
button:disabled{opacity:.45;cursor:default;border-color:var(--line2)}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:500 13px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:6px 8px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;padding:3px;background:var(--panel)}
.seg button{border:0;border-radius:6px;padding:7px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.panes{min-width:0;display:flex;flex-direction:column}
nav.tabs{display:flex;flex-direction:column;border-right:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);padding-right:12px;gap:2px}
nav.tabs button{justify-content:flex-start;text-align:left;border:0;border-left:2px solid transparent;border-radius:0 7px 7px 0;background:none;padding:9px 12px;font-size:14px;color:var(--muted)}
nav.tabs button:hover{background:var(--panel)}
nav.tabs button[aria-selected="true"]{border-left-color:var(--accent);background:var(--panel);color:var(--ink)}
.navlbl{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:14px 14px 6px}
.navlbl:first-child{padding-top:4px}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr);gap:16px}nav.tabs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);position:static;padding-right:0}nav.tabs button{border-left:0;border-bottom:2px solid transparent;border-radius:0;white-space:nowrap;padding:12px}nav.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);background:none}.navlbl{display:none}}

.lab{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1150px){.lab{grid-template-columns:minmax(0,1fr)}}
.plot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.plot svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;cursor:grab}
.plot svg.grabbing{cursor:grabbing}
.plotbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:4px 4px 10px}
.hint{font-size:13px;color:var(--faint)}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.block{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fin{display:flex;align-items:center;gap:8px}
.fin label{font:500 15px var(--mono);white-space:nowrap}
.fin input,.txt{flex:1;min-width:0;height:36px;font:500 15px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:0 10px}
.txt.sm{flex:none;width:90px}
.bad{border-color:var(--bad)!important}
.err{font-size:13px;color:var(--bad);min-height:18px;margin:4px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:500 13px var(--mono);padding:6px 9px}
.chips button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.chips.txtc button{font-family:var(--body)}
.tog[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.tog .sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.eq{font:500 18px/1.4 var(--mono);margin:6px 0 4px;overflow-wrap:anywhere}
.how{font-size:14px;color:var(--muted);line-height:1.65}
.how code,.mono{font:13px var(--mono);color:var(--ink)}
.status{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:500 13px/1 var(--body);padding:7px 11px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.no{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.info{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.sl{display:grid;grid-template-columns:22px minmax(0,1fr) 56px;gap:10px;align-items:center;margin:4px 0}
.sl b{font:500 15px var(--mono)}
.sl output{font:500 14px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--accent);width:100%;min-width:0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font:500 14px var(--mono);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.tbl{border-collapse:collapse;font:13px var(--mono);font-variant-numeric:tabular-nums;width:100%}
.tbl th{font:500 12px var(--body);color:var(--muted);text-align:right;padding:4px 8px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.cur td{background:var(--hl)}
.tbl.click tbody tr{cursor:pointer}
.tbl.click tbody tr:hover td{background:var(--accent-bg)}
.dsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dsteps li{font:13px/1.5 var(--mono);color:var(--ink);border-left:2px solid var(--line2);padding:3px 0 3px 10px;overflow-wrap:anywhere}
.dsteps .r{display:inline-block;font:500 11px var(--body);letter-spacing:.03em;color:var(--accent);background:var(--accent-bg);border-radius:5px;padding:2px 6px;margin-right:6px}
.big{font:500 26px var(--mono);font-variant-numeric:tabular-nums}
.lbl{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);display:block;margin-bottom:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
.cell b{display:block;font:500 18px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cell span{font-size:12px;color:var(--muted)}
.trick{background:var(--hl);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6;color:var(--ink)}
.trick b{font-weight:600}
/* practice */
.prac{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
@media (max-width:1100px){.prac{grid-template-columns:minmax(0,1fr)}}
.excard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.kind{font:500 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.prompt{font-size:17px;line-height:1.6}
.prompt .m{font:500 17px var(--mono);white-space:nowrap}
.mathline{font:500 20px/1.5 var(--mono);overflow-wrap:anywhere}
.answers{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.answers label{font:500 15px var(--mono);display:inline-flex;align-items:center;gap:6px}
.answers input{width:170px;height:38px;font:500 15px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:0 10px}
.fb{border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.65}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.sol{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sol ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.6}
.sol ol li::marker{color:var(--faint);font:12px var(--mono)}
.m{font-family:var(--mono)}
.hints{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.hints li{font-size:14px;color:var(--muted);border-left:2px solid var(--line2);padding:2px 0 2px 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:500 24px var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.small{font-size:13px;color:var(--faint)}
/* theory */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.note .area{font:500 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.note p{margin:0;color:var(--muted);font-size:14px}
.note p b{color:var(--ink);font-weight:500}
.f{font:500 14px/1.7 var(--mono);color:var(--ink);background:var(--bg);border-radius:7px;padding:8px 10px;overflow-x:auto;white-space:pre}
.note .try{margin-top:auto;align-self:flex-start}
.thbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.ruf{border-collapse:collapse;font:13px var(--mono);font-variant-numeric:tabular-nums;margin:4px 0}
.ruf td{padding:3px 9px;text-align:right;white-space:nowrap}
.ruf td:first-child{border-right:1.5px solid var(--muted);color:var(--accent)}
.ruf tr:nth-child(2) td{border-bottom:1.5px solid var(--muted)}
.ruf .rem{background:var(--ok-bg);color:var(--ok);border-radius:4px}
.steps2{display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.6;color:var(--muted)}
.steps2 .st{border-left:2px solid var(--line2);padding-left:10px}
.steps2 .st b{color:var(--ink);font-weight:500}
.steps2 .m{color:var(--ink)}
.sols{display:flex;flex-direction:column;gap:6px}
.sol1{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font:500 18px var(--mono)}
.sol1 .ap{font:13px var(--mono);color:var(--faint)}
.sol1.rej{color:var(--faint);text-decoration:line-through;font-size:15px}
.tri6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tri6 label{display:flex;flex-direction:column;gap:3px;font:500 13px var(--mono);color:var(--muted)}
.tri6 input{height:34px;font:500 14px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:0 8px;width:100%;min-width:0}
.tri6 input.given{border-color:var(--accent);background:var(--accent-bg)}
.cforms{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font:13px var(--mono);margin:0}
.cforms dt{color:var(--muted);font-family:var(--body)}
.cforms dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.plot canvas{display:block;width:100%;height:auto;aspect-ratio:680/440;touch-action:none;cursor:crosshair;border-radius:8px;max-width:100%}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{font-size:14px;padding:10px 14px}
.choices button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.choices button.right{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.choices button.wrong{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.accrow{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:4px 10px;align-items:center;font-size:13px}
.accbar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.accbar i{display:block;height:100%;background:var(--ok)}
.accbar i.lo{background:var(--bad)}
.exnav{display:flex;flex-wrap:wrap;gap:6px}
.exnav button{font:500 12px var(--mono);min-width:34px;justify-content:center;padding:6px 8px}
.exnav button.done{background:var(--accent-bg);border-color:var(--accent)}
.exnav button[aria-current="true"]{border-width:2px;border-color:var(--ink)}
.review details{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.review summary{cursor:pointer;font-size:14px}
label.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);cursor:pointer}
label.chk input{accent-color:var(--accent);width:16px;height:16px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <div>
    <h1>Calculus<em>Lab</em></h1>
    <p class="sub" data-en="Precalculus and calculus you can touch. Shape functions, spin the unit circle, watch limits close in, differentiate symbolically with every rule shown, build Riemann sums and Taylor polynomials, then practise with endless exercises." data-es="Precálculo y cálculo que puedes tocar. Transforma funciones, gira la circunferencia unidad, observa cómo se cierran los límites, deriva simbólicamente viendo cada regla, construye sumas de Riemann y polinomios de Taylor, y practica con ejercicios infinitos."></p>
  </div>
  <div class="seg" role="group" aria-label="Language / Idioma">
    <button id="len" aria-pressed="true" onclick="setLang('en')">EN</button>
    <button id="les" aria-pressed="false" onclick="setLang('es')">ES</button>
  </div>
</header>

<div class="app">
<nav class="tabs" role="tablist" aria-orientation="vertical">
  <span class="navlbl" data-en="Learn" data-es="Aprender"></span>
  <button role="tab" id="tab-lab" onclick="showTab('lab')" data-en="Function lab" data-es="Laboratorio de funciones"></button>

  <span class="navlbl" data-en="Precalculus" data-es="Precálculo"></span>
  <button role="tab" id="tab-fun" onclick="showTab('fun')" data-en="Functions" data-es="Funciones"></button>
  <button role="tab" id="tab-eqn" onclick="showTab('eqn')" data-en="Equations" data-es="Ecuaciones"></button>
  <button role="tab" id="tab-iq" onclick="showTab('iq')" data-en="Inequalities & |x|" data-es="Inecuaciones y |x|"></button>
  <button role="tab" id="tab-fac" onclick="showTab('fac')" data-en="Factorization" data-es="Factorización"></button>
  <button role="tab" id="tab-trig" onclick="showTab('trig')" data-en="Unit circle" data-es="Circunferencia unidad"></button>

  <button role="tab" id="tab-int" onclick="showTab('int')" data-en="Integrals" data-es="Integrales"></button>

  <button role="tab" id="tab-ser" onclick="showTab('ser')" data-en="Sequences & series" data-es="Sucesiones y series"></button>

  <button role="tab" id="tab-gd" onclick="showTab('gd')" data-en="Gradient descent" data-es="Descenso de gradiente"></button>
</nav>
<div class="panes">

<!-- FUNCTION LAB -->
<section id="p-lab" class="lab">
  <div class="plot">
    <div class="plotbar">
      <div class="row" id="lab-togs"></div>
      <div class="row"><button onclick="PL.lab.zoom(1.25)" aria-label="Zoom out">−</button><button onclick="PL.lab.zoom(0.8)" aria-label="Zoom in">+</button><button onclick="PL.lab.reset()" data-en="Reset view" data-es="Vista inicial"></button></div>
    </div>
    <svg id="sv-lab" viewBox="0 0 680 440" role="img" aria-label="Function plot"></svg>
    <div class="status" id="st-lab" style="padding:10px 4px 2px"></div>
    <p class="hint" style="margin:6px 4px 0" data-en="Drag the dot to move the tangent. Drag the background to pan, scroll or pinch to zoom." data-es="Arrastra el punto para mover la tangente. Arrastra el fondo para desplazar; rueda o pellizco para hacer zoom."></p>
  </div>
  <div class="side">
    <div class="block">
      <h2 data-en="Function" data-es="Función"></h2>
      <div class="fin"><label for="f-lab">f(x) =</label><input id="f-lab" spellcheck="false" autocomplete="off"></div>
      <div class="err" id="e-lab"></div>
      <div class="chips" id="lab-pre"></div>
    </div>
    <div class="block">
      <h2 data-en="Transformations" data-es="Transformaciones"></h2>
      <div class="eq" style="font-size:15px">g(x) = a·f(b(x − h)) + k</div>
      <div id="lab-sl"></div>
      <div class="how" id="lab-tx"></div>

<script>
/* ================= CORE ================= */
const NS='http://www.w3.org/2000/svg',PW=680,PH=440;
let lang='en';
const T=(en,es)=>lang==='es'?es:en;
const $=id=>document.getElementById(id);
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
function save(k,v){try{localStorage.setItem('tangentlab-'+k,JSON.stringify(v))}catch(e){}}
function load(k){try{return JSON.parse(localStorage.getItem('tangentlab-'+k)||'null')}catch(e){return null}}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function fmt(x,d=4){if(x===Infinity)return'∞';if(x===-Infinity)return'−∞';if(typeof x!=='number'||isNaN(x))return T('undefined','no definido');if(Math.abs(x)<1e-10)return'0';
 const a=Math.abs(x);let s;if(a>=1e6||a<1e-4)s=x.toExponential(2);else s=(+x.toFixed(d)).toString();return s.replace('-','−')}
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
function toFrac(v,maxQ=1000,tol=1e-9){if(!isFinite(v))return null;for(let q=1;q<=maxQ;q++){const p=Math.round(v*q);if(Math.abs(p/q-v)<tol*Math.max(1,Math.abs(v)))return[p,q]}return null}
function fracStr(v,maxQ=1000,tol=1e-9){const r=toFrac(v,maxQ,tol);if(!r)return null;const[p,q]=r;return q===1?String(p).replace('-','−'):`${p<0?'−':''}${Math.abs(p)}/${q}`}
/* nice exact-ish form: fraction, or multiple of pi, sqrt2, sqrt3, e */
function niceVal(v){if(!isFinite(v))return fmt(v);const f=fracStr(v,200,1e-9);if(f)return f;
 const cands=[[Math.PI,'π'],[Math.PI*Math.PI,'π²'],[Math.E*Math.E,'e²'],[Math.SQRT2,'√2'],[Math.sqrt(3),'√3'],[Math.E,'e'],[Math.LN2,'ln 2']];
 for(const[c,s]of cands){const r=toFrac(v/c,24,1e-9);if(r){const[p,q]=r;const n=Math.abs(p)===1?'':Math.abs(p);return`${p<0?'−':''}${n}${s}${q>1?'/'+q:''}`}}
 return null}
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const nz=(a,b)=>{let v=0;while(!v)v=ri(a,b);return v};

/* ---------- AST ---------- */
const N=(v,s)=>s?{t:'n',v,s}:{t:'n',v};
const X={t:'x'};
const B=(t,a,b)=>({t,a,b});
const F=(f,a)=>({t:'f',f,a});
const Neg=a=>({t:'neg',a});
const hasX=n=>n.t==='x'||n.t==='pw'?true:n.t==='n'||n.t==='i'||!n.a?false:n.t==='f'||n.t==='neg'?hasX(n.a):hasX(n.a)||hasX(n.b);
const plain=n=>n.t==='n'&&!n.s;
const size=n=>n.t==='pw'?6:!n.a?1:n.t==='f'||n.t==='neg'?1+size(n.a):1+size(n.a)+size(n.b);

/* ---------- parser ---------- */
const FNS=['cis','arcsin','arccos','arctan','asin','acos','atan','sinh','cosh','tanh','sqrt','sin','cos','tan','sec','csc','cot','exp','abs','ln','log','sen','tg'];
function PErr(en,es){const e=new Error(T(en,es));e.parse=true;return e}
function tokenize(src,opts){
 let s=src.replace(/−/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/²/g,'^2').replace(/³/g,'^3').replace(/∞/g,'inf').replace(/\*\*/g,'^').toLowerCase();
 const out=[];let i=0;
 while(i<s.length){const c=s[i];
  if(/\s/.test(c)){i++;continue}
  if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const v=Number(s.slice(i,j));if(isNaN(v))throw PErr(`Bad number "${s.slice(i,j)}"`,`Número no válido "${s.slice(i,j)}"`);out.push({k:'n',v});i=j;continue}
  if(/[a-z]/.test(c)){const m=FNS.find(f=>s.startsWith(f,i));
   if(m){let v=m.replace(/^arc/,'a');if(v==='sen')v='sin';if(v==='tg')v='tan';out.push({k:'f',v});i+=m.length;continue}
   if(s.startsWith('pi',i)){out.push({k:'c',v:'pi'});i+=2;continue}
   if(s.startsWith('inf',i)){out.push({k:'c',v:'inf'});i+=3;continue}
   if(c==='x'){out.push({k:'x'});i++;continue}
   if(opts&&opts.y&&c==='y'){out.push({k:'y'});i++;continue}
   if(c==='e'){out.push({k:'c',v:'e'});i++;continue}
   if(opts&&opts.i&&c==='i'){out.push({k:'c',v:'i'});i++;continue}
   let j=i;while(j<s.length&&/[a-z]/.test(s[j]))j++;
   throw PErr(`Unknown name "${s.slice(i,j)}". Use x as the variable.`,`Nombre desconocido "${s.slice(i,j)}". Usa x como variable.`)}
  if('+-*/^(),|!'.includes(c)){out.push({k:c});i++;continue}
  throw PErr(`Unexpected "${c}"`,`Carácter inesperado "${c}"`)}
 // classify bars
 const opn=['+','-','*','/','^','(',',','|o','f'];
 out.forEach((t,j)=>{if(t.k==='|'){const p=out[j-1];t.k=(!p||opn.includes(p.k))?'|o':'|c'}});
 // implicit multiplication
 const res=[];
 out.forEach((t,j)=>{const p=res[res.length-1];
  if(p&&['n','x','y','c',')','|c','!'].includes(p.k)&&['n','x','y','c','f','(','|o'].includes(t.k)){
   const sinpow=p.k==='n'&&res.length>=3&&res[res.length-2].k==='^'&&res[res.length-3].k==='f';
   if(!(sinpow&&t.k==='('))res.push({k:'*'})}
  res.push(t)});
 return res}
function parse(src,opts){
 if(src&&/;|\bif\b/.test(src)){let s=src.trim().replace(/^\{/,'').replace(/\}$/,'');const P=[];
  s.split(';').map(x=>x.trim()).filter(Boolean).forEach(piece=>{let e,c='';const m=piece.split(/\bif\b/);if(m.length===2){e=m[0];c=m[1]}else{const k=piece.lastIndexOf(',');if(k>0&&/[<>]/.test(piece.slice(k))){e=piece.slice(0,k);c=piece.slice(k+1)}else e=piece}
   c=c.trim().replace(/≤/g,'<=').replace(/≥/g,'>=');const conds=[];if(c&&!/^(otherwise|else|si no|en otro caso)$/i.test(c)){const parts=c.split(/(<=|>=|<|>)/);if(parts.length!==3&&parts.length!==5)throw PErr('Write each piece as: expression if condition, e.g. x^2 if x<1; 2x if x>=1','Escribe cada trozo así: expresión if condición, p. ej. x^2 if x<1; 2x if x>=1');
    for(let j=0;j+2<parts.length;j+=2)conds.push({L:parse0(parts[j],opts),op:parts[j+1],R:parse0(parts[j+2],opts)})}
   P.push({e:parse0(e,opts),c:conds})});return{t:'pw',P}}
 return parse0(src,opts)}
function parse0(src,opts){
 if(!src||!src.trim())throw PErr('Type an expression','Escribe una expresión');
 const tk=tokenize(src,opts);let p=0;
 const peek=()=>tk[p],eat=k=>{if(tk[p]&&tk[p].k===k){p++;return true}return false};
 const need=(k,en,es)=>{if(!eat(k))throw PErr(en,es)};
 function expr(){let a=term();while(peek()&&(peek().k==='+'||peek().k==='-')){const o=tk[p++].k;a=B(o,a,term())}return a}
 function term(){let a=unary();while(peek()&&(peek().k==='*'||peek().k==='/')){const o=tk[p++].k;a=B(o,a,unary())}return a}
 function unary(){if(eat('-'))return Neg(unary());if(eat('+'))return unary();return power()}
 function power(){let b=primary();while(eat('!'))b=F('fact',b);if(eat('^'))return B('^',b,unary());return b}

  if(!t)throw PErr('The expression ends too early','La expresión termina antes de tiempo');
  if(t.k==='n')return N(t.v);
  if(t.k==='x')return X;
  if(t.k==='y')return{t:'y'};

 quotient:['Quotient rule','Regla del cociente'],power:['Power rule','Regla de la potencia'],exp:['Exponential','Exponencial'],
 expa:['Exponential base a','Exponencial de base a'],logdiff:['Logarithmic differentiation','Derivación logarítmica'],
 neg:['Sign','Signo'],chain:['chain','cadena']};
const RULEF={sum:"(u ± v)' = u' ± v'",const:"(c·u)' = c·u'",product:"(u·v)' = u'v + uv'",quotient:"(u/v)' = (u'v − uv')/v²",power:"(uⁿ)' = n·uⁿ⁻¹·u'",exp:"(eᵘ)' = eᵘ·u'",expa:"(aᵘ)' = aᵘ·ln a·u'",logdiff:"(uᵛ)' = uᵛ(v'·ln u + v·u'/u)",neg:"(−u)' = −u'",
 sin:"(sin u)' = cos u·u'",cos:"(cos u)' = −sin u·u'",tan:"(tan u)' = u'/cos²u",sec:"(sec u)' = sec u·tan u·u'",csc:"(csc u)' = −csc u·cot u·u'",cot:"(cot u)' = −u'/sin²u",
 asin:"(arcsin u)' = u'/√(1−u²)",acos:"(arccos u)' = −u'/√(1−u²)",atan:"(arctan u)' = u'/(1+u²)",sinh:"(sinh u)' = cosh u·u'",cosh:"(cosh u)' = sinh u·u'",tanh:"(tanh u)' = u'/cosh²u",
 sqrt:"(√u)' = u'/(2√u)",exp_f:"(exp u)' = exp u·u'",ln:"(ln u)' = u'/u",log:"(log u)' = u'/(u·ln 10)",abs:"|u|' = u/|u|·u'"};
function outer(f,u){switch(f){
 case 'sin':return F('cos',u);case 'cos':return Neg(F('sin',u));case 'tan':return B('/',N(1),B('^',F('cos',u),N(2)));
 case 'sec':return B('*',F('sec',u),F('tan',u));case 'csc':return Neg(B('*',F('csc',u),F('cot',u)));case 'cot':return Neg(B('/',N(1),B('^',F('sin',u),N(2))));
 case 'asin':return B('/',N(1),F('sqrt',B('-',N(1),B('^',u,N(2)))));case 'acos':return Neg(B('/',N(1),F('sqrt',B('-',N(1),B('^',u,N(2))))));
 case 'atan':return B('/',N(1),B('+',N(1),B('^',u,N(2))));case 'sinh':return F('cosh',u);case 'cosh':return F('sinh',u);case 'tanh':return B('/',N(1),B('^',F('cosh',u),N(2)));
 case 'sqrt':return B('/',N(1),B('*',N(2),F('sqrt',u)));case 'exp':return F('exp',u);case 'ln':return B('/',N(1),u);
 case 'log':return B('/',N(1),B('*',u,F('ln',N(10))));case 'abs':return B('/',u,F('abs',u))}}
function D(n,steps,depth=0){
 if(n.t==='pw')throw PErr('Piecewise function: differentiate each piece separately','Función a trozos: deriva cada trozo por separado');
 if(n.t==='f'&&n.f==='fact'&&hasX(n))throw PErr('n! has no elementary derivative','n! no tiene derivada elemental');
 if(!hasX(n)){if(steps&&depth===0)steps.push({rule:'const0',depth,expr:n,res:N(0)});return N(0)}
 if(n.t==='x'){if(steps&&depth===0)steps.push({rule:'power',depth,expr:n,res:N(1)});return N(1)}
 const idx=steps?steps.length:0;if(steps)steps.push(null);
 const d=u=>D(u,steps,depth+1);let r,rule,chain=false;
 switch(n.t){
 case '+':case '-':rule='sum';r=B(n.t,d(n.a),d(n.b));break;
 case 'neg':rule='neg';r=Neg(d(n.a));break;
 case '*':if(!hasX(n.a)){rule='const';r=B('*',n.a,d(n.b))}else if(!hasX(n.b)){rule='const';r=B('*',n.b,d(n.a))}else{rule='product';const da=d(n.a),db=d(n.b);r=B('+',B('*',da,n.b),B('*',n.a,db))}break;
 case '/':if(!hasX(n.b)){rule='const';r=B('/',d(n.a),n.b)}else{rule='quotient';const da=d(n.a),db=d(n.b);r=B('/',B('-',B('*',da,n.b),B('*',n.a,db)),B('^',n.b,N(2)))}break;
 case '^':
  if(!hasX(n.b)){rule='power';chain=n.a.t!=='x';const du=d(n.a);r=B('*',B('*',n.b,B('^',n.a,B('-',n.b,N(1)))),du)}
  else if(!hasX(n.a)){const isE=n.a.t==='n'&&n.a.s==='e';rule=isE?'exp':'expa';chain=n.b.t!=='x';const du=d(n.b);r=B('*',isE?n:B('*',n,F('ln',n.a)),du)}
  else{rule='logdiff';const da=d(n.a),db=d(n.b);r=B('*',n,B('+',B('*',db,F('ln',n.a)),B('/',B('*',n.b,da),n.a)))}
  break;
 case 'f':{rule=n.f==='exp'?'exp_f':n.f;chain=n.a.t!=='x';const du=d(n.a);r=B('*',outer(n.f,n.a),du);break}}
 const rs=simp(r);
 if(steps)steps[idx]={rule,chain,depth,expr:n,res:rs};
 return rs}
const dd=n=>D(n,null);
function ruleName(s){if(s.rule==='const0')return T('Constant','Constante');
 const fn=['sin','cos','tan','sec','csc','cot','asin','acos','atan','sinh','cosh','tanh','sqrt','exp_f','ln','log','abs'];
 let name=fn.includes(s.rule)?(FNAME[s.rule]||s.rule.replace('_f','')):(RULES[s.rule]?RULES[s.rule][lang==='es'?1:0]:s.rule);
 if(s.chain)name+=' + '+T('chain','cadena');return name}

/* ---------- antiderivative (common forms) ---------- */
function lin(u){if(!hasX(u))return null;const du=dd(u);if(hasX(du))return null;const m=ev(du,0);return m?{m}:null}
function integ(n){
 if(!hasX(n))return B('*',n,X);
 switch(n.t){
 case 'x':return B('/',B('^',X,N(2)),N(2));
 case '+':case '-':{const A=integ(n.a),C=integ(n.b);return A&&C?B(n.t,A,C):null}
 case 'neg':{const A=integ(n.a);return A?Neg(A):null}
 case '*':if(!hasX(n.a)){const A=integ(n.b);return A?B('*',n.a,A):null}if(!hasX(n.b)){const A=integ(n.a);return A?B('*',n.b,A):null}return null;
 case '/':if(!hasX(n.b)){const A=integ(n.a);return A?B('/',A,n.b):null}
  if(!hasX(n.a)){const L=lin(n.b);if(L)return B('*',B('/',n.a,mkRat(L.m)),F('ln',F('abs',n.b)));
   if(n.b.t==='^'&&!hasX(n.b.b))return integ(B('*',n.a,B('^',n.b.a,Neg(n.b.b))));
   if(n.b.t==='f'&&n.b.f==='sqrt')return integ(B('*',n.a,B('^',n.b.a,mkRat(-0.5))));
   if(n.b.t==='+'&&rat(n.b.a)===1&&n.b.b.t==='^'&&n.b.b.a.t==='x'&&rat(n.b.b.b)===2)return B('*',n.a,F('atan',X));
   if(n.b.t==='+'&&rat(n.b.b)===1&&n.b.a.t==='^'&&n.b.a.a.t==='x'&&rat(n.b.a.b)===2)return B('*',n.a,F('atan',X));}
  return null;
 case '^':if(!hasX(n.b)){const L=lin(n.a);if(!L)return null;const k=ev(n.b,0);if(Math.abs(k+1)<1e-12)return B('/',F('ln',F('abs',n.a)),mkRat(L.m));const k1=simp(B('+',n.b,N(1)));return B('/',B('^',n.a,k1),simp(B('*',mkRat(L.m),k1)))}
  if(!hasX(n.a)){const L=lin(n.b);if(!L)return null;return n.a.s==='e'?B('/',n,mkRat(L.m)):B('/',n,B('*',mkRat(L.m),F('ln',n.a)))}
  return null;
 case 'f':{const L=lin(n.a);if(!L)return null;const u=n.a,m=mkRat(L.m);
  switch(n.f){case 'sin':return Neg(B('/',F('cos',u),m));case 'cos':return B('/',F('sin',u),m);case 'exp':return B('/',F('exp',u),m);
   case 'sqrt':return B('/',B('*',N(2),B('^',u,B('/',N(3),N(2)))),simp(B('*',N(3),m)));
   case 'sinh':return B('/',F('cosh',u),m);case 'cosh':return B('/',F('sinh',u),m);default:return null}}}
 return null}

/* ---------- numeric helpers ---------- */
function simpson(f,a,b){const sw=a>b;if(sw)[a,b]=[b,a];
 const S=(a,b,fa,fm,fb)=>(b-a)/6*(fa+4*fm+fb);
 function rec(a,b,fa,fm,fb,whole,eps,depth){const m=(a+b)/2,lm=(a+m)/2,rm=(m+b)/2,flm=f(lm),frm=f(rm),L=S(a,m,fa,flm,fm),R=S(m,b,fm,frm,fb);
  if(depth<=0||Math.abs(L+R-whole)<=15*eps)return L+R+(L+R-whole)/15;return rec(a,m,fa,flm,fm,L,eps/2,depth-1)+rec(m,b,fm,frm,fb,R,eps/2,depth-1)}
 const fa=f(a),fb=f(b),fm=f((a+b)/2);const r=rec(a,b,fa,fm,fb,S(a,b,fa,fm,fb),1e-10,40);return sw?-r:r}
/* roots of g in [x0,x1] (sign changes + touching zeros), excluding asymptote jumps */
function roots(g,x0,x1,n=500){const out=[];let px=x0,py=g(x0);const H=[];
 for(let i=1;i<=n;i++){const x=x0+(x1-x0)*i/n,y=g(x);H.push([x,y]);
  if(isFinite(py)&&isFinite(y)){
   if(py===0)out.push(px);
   else if(py*y<0){let a=px,b=x,fa=py;for(let k=0;k<60;k++){const m=(a+b)/2,fm=g(m);if(!isFinite(fm))break;if(fa*fm<=0)b=m;else{a=m;fa=fm}}const r=(a+b)/2;if(Math.abs(g(r))<1e-6*Math.max(1,Math.abs(py),Math.abs(y)))out.push(r)}}
  px=x;py=y}
 // touching zeros
 for(let i=1;i<H.length-1;i++){const[x,y]=H[i];if(isFinite(y)&&Math.abs(y)<=Math.abs(H[i-1][1])&&Math.abs(y)<=Math.abs(H[i+1][1])&&H[i-1][1]*H[i+1][1]>0){
  let a=H[i-1][0],b=H[i+1][0];for(let k=0;k<60;k++){const m1=a+(b-a)/3,m2=b-(b-a)/3;if(Math.abs(g(m1))<Math.abs(g(m2)))b=m2;else a=m1}const r=(a+b)/2;if(Math.abs(g(r))<1e-7)out.push(r)}}
 out.sort((a,b)=>a-b);return out.filter((r,i)=>i===0||Math.abs(r-out[i-1])>(x1-x0)*1e-4).map(r=>Math.abs(r)<1e-9?0:r)}

/* ================= PLOT ENGINE ================= */
function niceStep(r){const raw=r/8,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*p}
class Plot{
 constructor(id,view,onDraw,opt={}){this.svg=$(id);this.v={...view};this.v0={...view};this.onDraw=onDraw;this.opt=opt;this.handles=[];this.ptrs=new Map();
  this.svg.innerHTML='';this.gG=mk('g',{},this.svg);this.gB=mk('g',{},this.svg);this.gM=mk('g',{},this.svg);this.gT=mk('g',{},this.svg);this.bind()}
 X(x){return(x-this.v.x0)/(this.v.x1-this.v.x0)*PW}
 Y(y){return PH-(y-this.v.y0)/(this.v.y1-this.v.y0)*PH}
 ix(px){return this.v.x0+px/PW*(this.v.x1-this.v.x0)}
 iy(py){return this.v.y0+(PH-py)/PH*(this.v.y1-this.v.y0)}
 pos(e){const r=this.svg.getBoundingClientRect();return[(e.clientX-r.left)/(r.width||PW)*PW,(e.clientY-r.top)/(r.height||PH)*PH]}
 bind(){const s=this.svg;
  s.addEventListener('pointerdown',e=>{const[px,py]=this.pos(e);this.ptrs.set(e.pointerId,[px,py]);try{s.setPointerCapture(e.pointerId)}catch(_){}
   if(this.ptrs.size===2){this.pinch=this.pdist();this.drag=null;return}
   const sc=PW/(s.getBoundingClientRect().width||PW);let best=null,bd=22*Math.max(1,sc);
   this.handles.forEach(h=>{const hx=this.X(h.x()),hy=this.Y(h.y());const dd=Math.hypot(hx-px,hy-py);if(dd<bd){bd=dd;best=h}});
   this.drag=best?{h:best}:{pan:[px,py],v:{...this.v}};s.classList.add('grabbing');e.preventDefault()});
  s.addEventListener('pointermove',e=>{if(!this.ptrs.has(e.pointerId))return;const[px,py]=this.pos(e);this.ptrs.set(e.pointerId,[px,py]);
   if(this.ptrs.size===2&&this.pinch){const d=this.pdist();if(d>0){this.zoom(this.pinch/d);this.pinch=d}return}
   if(!this.drag)return;
   if(this.drag.h){this.drag.h.set(this.ix(px),this.iy(py));return}
   const[sx,sy]=this.drag.pan,v=this.drag.v,dx=(px-sx)/PW*(v.x1-v.x0),dy=(py-sy)/PH*(v.y1-v.y0);
   if(this.opt.lockY)this.v={x0:v.x0-dx,x1:v.x1-dx,y0:v.y0,y1:v.y1};else this.v={x0:v.x0-dx,x1:v.x1-dx,y0:v.y0+dy,y1:v.y1+dy};this.draw()});
  const up=e=>{this.ptrs.delete(e.pointerId);if(this.ptrs.size<2)this.pinch=null;if(!this.ptrs.size){this.drag=null;s.classList.remove('grabbing');this.opt.onUp&&this.opt.onUp()}};
  s.addEventListener('pointerup',up);s.addEventListener('pointercancel',up);
  s.addEventListener('wheel',e=>{e.preventDefault();const[px,py]=this.pos(e);this.zoom(e.deltaY>0?1.12:1/1.12,this.ix(px),this.iy(py))},{passive:false})}
 pdist(){const p=[...this.ptrs.values()];return Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1])}
 zoom(f,cx,cy){const v=this.v;cx=cx??(v.x0+v.x1)/2;cy=cy??(v.y0+v.y1)/2;const w=(v.x1-v.x0)*f,h=(v.y1-v.y0)*f;if(w<1e-4||w>1e5)return;
  this.v={x0:cx-(cx-v.x0)*f,x1:cx+(v.x1-cx)*f,y0:cy-(cy-v.y0)*f,y1:cy+(v.y1-cy)*f};this.draw()}
 setView(v){this.v={...v};this.draw()}
 reset(){this.v={...this.v0};this.draw()}
 draw(){if(this.svg.closest('section')&&this.svg.closest('section').hidden)return;this.grid();this.gB.innerHTML=this.gM.innerHTML=this.gT.innerHTML='';this.handles=[];this.onDraw(this)}
 grid(){const G=this.gG;G.innerHTML='';const{x0,x1,y0,y1}=this.v;
  const pi=this.opt.piTicks,sx=pi?Math.PI/2*Math.max(1,Math.round(niceStep(x1-x0)/(Math.PI/2))):niceStep(x1-x0),sy=niceStep(y1-y0);
  const ax=Math.min(Math.max(this.Y(0),0),PH),ay=Math.min(Math.max(this.X(0),0),PW);
  for(let x=Math.ceil(x0/sx)*sx;x<=x1;x+=sx){const px=this.X(x),z=Math.abs(x)<sx/1e3;mk('line',{x1:px,y1:0,x2:px,y2:PH,'stroke-width':z?1.5:1,style:`stroke:var(${z?'--axis':'--grid'})`},G);
   if(!z){const t=mk('text',{x:px,y:Math.min(ax+15,PH-5),'text-anchor':'middle',style:'font:11px var(--mono);fill:var(--faint)'},G);t.textContent=pi?piLabel(x):fmtTick(x,sx)}}
  for(let y=Math.ceil(y0/sy)*sy;y<=y1;y+=sy){const py=this.Y(y),z=Math.abs(y)<sy/1e3;mk('line',{x1:0,y1:py,x2:PW,y2:py,'stroke-width':z?1.5:1,style:`stroke:var(${z?'--axis':'--grid'})`},G);
   if(!z){const t=mk('text',{x:ay>PW-30?ay-5:ay+5,y:py-4,'text-anchor':ay>PW-30?'end':'start',style:'font:11px var(--mono);fill:var(--faint)'},G);t.textContent=fmtTick(y,sy)}}}
 curve(fn,c,w=2.5,dash,g){g=g||this.gM;const n=700,{x0,x1,y0,y1}=this.v,H=y1-y0,mid=(y0+y1)/2;let d='',pen=false,py=null;
  for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;let y;try{y=fn(x)}catch(e){y=NaN}
   if(!isFinite(y)){pen=false;py=null;continue}
   if(pen&&py!==null&&Math.abs(y-py)>H*1.5&&(Math.abs(y-mid)>H*0.8||Math.abs(py-mid)>H*0.8)&&Math.sign(y-mid)!==Math.sign(py-mid))pen=false;
   const yc=Math.max(y0-H*2,Math.min(y1+H*2,y));d+=(pen?'L':'M')+this.X(x).toFixed(1)+' '+this.Y(yc).toFixed(1);pen=true;py=y}
  return mk('path',{d,fill:'none','stroke-width':w,'stroke-linejoin':'round','stroke-linecap':'round',style:`stroke:${c}`+(dash?`;stroke-dasharray:${dash}`:'')},g)}
 line(xa,ya,xb,yb,c,w=1.5,dash,g){return mk('line',{x1:this.X(xa),y1:this.Y(ya),x2:this.X(xb),y2:this.Y(yb),'stroke-width':w,'stroke-linecap':'round',style:`stroke:${c}`+(dash?`;stroke-dasharray:${dash}`:'')},g||this.gM)}
 dot(x,y,c,r=5,g,hollow){if(!isFinite(y))return;return mk('circle',{cx:this.X(x),cy:this.Y(y),r,'stroke-width':2.2,style:hollow?`fill:var(--panel);stroke:${c}`:`fill:${c};stroke:var(--panel)`},g||this.gT)}
 text(x,y,s,c,anchor='start',dx=0,dy=0,g){const t=mk('text',{x:this.X(x)+dx,y:this.Y(y)+dy,'text-anchor':anchor,style:`font:500 12px var(--mono);fill:${c};paint-order:stroke;stroke:var(--panel);stroke-width:3px`},g||this.gT);t.textContent=s;return t}
 poly(pts,fill,op,stroke,g){return mk('polygon',{points:pts.map(([x,y])=>this.X(x).toFixed(1)+','+this.Y(Math.max(this.v.y0-1e3,Math.min(this.v.y1+1e3,y))).toFixed(1)).join(' '),'stroke-width':1,style:`fill:${fill};fill-opacity:${op};stroke:${stroke||'none'}`},g||this.gB)}
 band(xa,xb,ya,yb,fill,op,g){const X1=Math.min(this.X(xa),this.X(xb)),Y1=Math.min(this.Y(ya),this.Y(yb));return mk('rect',{x:X1,y:Y1,width:Math.abs(this.X(xb)-this.X(xa)),height:Math.abs(this.Y(yb)-this.Y(ya)),style:`fill:${fill};fill-opacity:${op}`},g||this.gB)}
 handle(o){this.handles.push(o)}}
function fmtTick(v,s){const d=Math.max(0,-Math.floor(Math.log10(s)+1e-9));return(+v.toFixed(d)).toString().replace('-','−')}
function piLabel(x){const k=Math.round(x/(Math.PI/2));if(!k)return'0';const r=toFrac(k/2,2,1e-9);const[p,q]=r;const n=Math.abs(p)===1?'':Math.abs(p);return(p<0?'−':'')+n+'π'+(q>1?'/'+q:'')}

/* ---------- truncated power series (exact Taylor coefficients at a point) ---------- */
function tser(n,a,K){const z=()=>new Array(K+1).fill(0);
 const cst=c=>{const r=z();r[0]=c;return r};
 const mul=(u,v)=>{const r=z();for(let i=0;i<=K;i++)if(u[i]!==0)for(let j=0;j+i<=K;j++)r[i+j]+=u[i]*v[j];return r};
 const div=(u,v)=>{const q=z();for(let k=0;k<=K;k++){let s=u[k];for(let j=0;j<k;j++)s-=q[j]*v[k-j];q[k]=s/v[0]}return q};
 const expS=u=>{const w=z();w[0]=Math.exp(u[0]);for(let k=1;k<=K;k++){let s=0;for(let j=1;j<=k;j++)s+=j*u[j]*w[k-j];w[k]=s/k}return w};
 const lnS=u=>{const w=z();w[0]=Math.log(u[0]);for(let k=1;k<=K;k++){let s=0;for(let j=1;j<k;j++)s+=j*w[j]*u[k-j];w[k]=(u[k]-s/k)/u[0]}return w};
 const sc=u=>{const s=z(),c=z();s[0]=Math.sin(u[0]);c[0]=Math.cos(u[0]);for(let k=1;k<=K;k++){let a=0,b=0;for(let j=1;j<=k;j++){a+=j*u[j]*c[k-j];b+=j*u[j]*s[k-j]}s[k]=a/k;c[k]=-b/k}return[s,c]};
 const powC=(u,r)=>{if(Number.isInteger(r)&&r>=0){let w=cst(1);for(let i=0;i<r;i++)w=mul(w,u);return w}
  if(Number.isInteger(r)&&r<0){let w=cst(1);for(let i=0;i<-r;i++)w=mul(w,u);return div(cst(1),w)}
  const w=z();w[0]=powR(u[0],r);for(let k=1;k<=K;k++){let s=0;for(let j=1;j<=k;j++)s+=(r*j-(k-j))*u[j]*w[k-j];w[k]=s/(k*u[0])}return w};

function subI(n,o){const cands=new Map();const scan=v=>{if(!v||!v.t)return;if(v.t==='f'){if(hasX(v.a)&&v.a.t!=='x')cands.set(str(v.a),v.a);if(v.f!=='sqrt'&&v.f!=='abs')cands.set(str(v),v)}

  build({v,a,k}){const ax=a===1?'x':a===-1?'−x':(a<0?'−':'')+Math.abs(a)+'x';const nm=fN();let fs,ans,ser;const ab=Math.abs(a)===1?'x':Math.abs(a)+'x';
   if(v==='exp'){fs=`e^(${ax})`;ans=Math.pow(a,k)/fact(k);ser='eᵘ = 1 + u + u²/2! + u³/3! + …'}
   if(v==='sin'){fs=`${nm.sin}(${ax})`;ans=Math.pow(-1,(k-1)/2)*Math.pow(a,k)/fact(k);ser=`${nm.sin} u = u − u³/3! + u⁵/5! − …`}
   if(v==='cos'){fs=`cos(${ax})`;ans=Math.pow(-1,k/2)*Math.pow(a,k)/fact(k);ser='cos u = 1 − u²/2! + u⁴/4! − …'}
   if(v==='geo'){fs=`1/(1 ${a<0?'+':'−'} ${ab})`;ans=Math.pow(a,k);ser='1/(1 − u) = 1 + u + u² + u³ + …'}
   if(v==='ln'){fs=`ln(1 ${a<0?'−':'+'} ${ab})`;ans=Math.pow(-1,k+1)*Math.pow(a,k)/k;ser='ln(1 + u) = u − u²/2 + u³/3 − …'}
   return{prompt:T(`Coefficient of x${sup(k)} in the Maclaurin series of`,`Coeficiente de x${sup(k)} en la serie de Maclaurin de`),math:`f(x) = ${fs}`,fields:[`c${subd(k)} =`],ans:[ans],
    steps:[T(`Known series: ${ser}`,`Serie conocida: ${ser}`),T(`Substitute u = ${ax}: the x${sup(k)} term comes from u${sup(k)} = (${ax})${sup(k)} = ${a**k}x${sup(k)}.`,`Sustituye u = ${ax}: el término en x${sup(k)} sale de u${sup(k)} = (${ax})${sup(k)} = ${a**k}x${sup(k)}.`),T(`Coefficient: <b>${fracStr(ans,100000)}</b>.`,`Coeficiente: <b>${fracStr(ans,100000)}</b>.`)],
    hints:[T('Do not differentiate: substitute into a series you know.','No derives: sustituye en una serie que conozcas.')],
    open:()=>{const src={exp:`e^(${a}*x)`,sin:`sin(${a}*x)`,cos:`cos(${a}*x)`,geo:`1/(1-(${a})*x)`,ln:`ln(1+(${a})*x)`}[v];TAY.f=$('f-tay').value=src;$('tay-a').value=0;$('tay-n').value=k;showTab('tay');tayCompute();PL.tay.reset()}}}}};
function openLim(f,a){LIM.f=$('f-lim').value=f;LIM.a=$('a-lim').value=a;showTab('lim');limCompute(true)}

let PR={topics:[],st:{ok:0,tot:0,streak:0,best:0}},EX=null;
function close_(u,v,raw){if(!isFinite(v)||!isFinite(u))return u===v;const tol=/[0-9]\.[0-9]/.test(raw)?0.0051*Math.max(1,Math.abs(v)):1e-6*Math.max(1,Math.abs(v));return Math.abs(u-v)<=tol}

const NOTES=[
 {a:'pre',t:['Transformations','Transformaciones'],p:['Every graph you meet is a known shape moved around. Read g(x) = a·f(b(x − h)) + k from the outside in.','Casi toda gráfica es una forma conocida desplazada. Lee g(x) = a·f(b(x − h)) + k de fuera hacia dentro.'],
  f:[['f(x) + k    up k\nf(x − h)    right h\na·f(x)      vertical ×a (a < 0 flips)\nf(b·x)      horizontal ×1/b (b < 0 flips)','f(x) + k    sube k\nf(x − h)    derecha h\na·f(x)      vertical ×a (a < 0 voltea)\nf(b·x)      horizontal ×1/b (b < 0 voltea)']],
  k:['Inside the bracket everything acts backwards: f(x − 3) moves right, f(2x) squeezes to half width.','Dentro del paréntesis todo actúa al revés: f(x − 3) va a la derecha, f(2x) se comprime a la mitad.'],go:()=>{showTab('lab')}},
 {a:'pre',t:['Domain','Dominio'],p:['The domain is every x where the formula makes sense. Three things break a formula.','El dominio son los x donde la fórmula tiene sentido. Tres cosas la rompen.'],
  f:[['1/u      u ≠ 0\n√u       u ≥ 0\nln u     u > 0\narcsin u  −1 ≤ u ≤ 1','1/u      u ≠ 0\n√u       u ≥ 0\nln u     u > 0\narcsen u  −1 ≤ u ≤ 1']],
  k:['Write one condition per problem spot, solve each, then intersect. √x/ln x needs x ≥ 0, x > 0 and x ≠ 1.','Escribe una condición por cada punto conflictivo, resuelve cada una e interseca. √x/ln x pide x ≥ 0, x > 0 y x ≠ 1.'],go:()=>{LAB.f=$('f-lab').value='sqrt(x)/ln(x)';showTab('lab');labCompute()}},
 {a:'pre',t:['Exponents and logarithms','Exponentes y logaritmos'],p:['log_b x answers one question: b to what power gives x? All the laws come from the exponent laws.','log_b x responde a una pregunta: ¿b elevado a qué da x? Todas las propiedades salen de las de exponentes.'],
  f:['aᵐ·aⁿ = aᵐ⁺ⁿ    (aᵐ)ⁿ = aᵐⁿ    a⁻ⁿ = 1/aⁿ\nlog(MN) = log M + log N\nlog(M/N) = log M − log N\nlog(Mᵏ) = k·log M\nlog_b x = ln x / ln b'],
  k:['Change of base turns any log into ln: log₂ 10 = ln 10 / ln 2 ≈ 3.32. And b^(log_b x) = x cancels instantly.','El cambio de base pasa cualquier logaritmo a ln: log₂ 10 = ln 10 / ln 2 ≈ 3,32. Y b^(log_b x) = x se cancela al instante.'],go:()=>{LAB.f=$('f-lab').value='2^x';showTab('lab');labCompute()}},
 {a:'pre',t:['Radians','Radianes'],p:['A radian is the angle whose arc equals the radius. Calculus formulas like (sin x)′ = cos x only hold in radians.','Un radián es el ángulo cuyo arco mide lo mismo que el radio. Fórmulas como (sen x)′ = cos x solo valen en radianes.'],
  f:[['rad = deg · π/180\narc length s = r·θ\nsector area = r²θ/2','rad = grados · π/180\nlongitud de arco s = r·θ\nárea del sector = r²θ/2']],
  k:['Anchor on 180° = π. Then 30°, 45°, 60° are π over 6, 4, 3, and every other key angle is a multiple of those.','Ancla en 180° = π. Entonces 30°, 45°, 60° son π entre 6, 4, 3, y el resto de ángulos clave son múltiplos.'],go:()=>showTab('trig')},
 {a:'pre',t:['Exact trig values','Valores trigonométricos exactos'],p:['Five angles generate all sixteen special values. Signs come from the quadrant.','Cinco ángulos generan los dieciséis valores notables. El signo lo da el cuadrante.'],
  f:[['θ     0    30°   45°   60°   90°\nsin   0    1/2   √2/2  √3/2  1\ncos   1    √3/2  √2/2  1/2   0\ntan   0    √3/3  1     √3    —','θ     0    30°   45°   60°   90°\nsen   0    1/2   √2/2  √3/2  1\ncos   1    √3/2  √2/2  1/2   0\ntg    0    √3/3  1     √3    —']],
  k:['Hand trick: sines are √0/2, √1/2, √2/2, √3/2, √4/2. Cosines are the same list backwards. tan = sin/cos.','Truco de la mano: los senos son √0/2, √1/2, √2/2, √3/2, √4/2. Los cosenos, la misma lista al revés. tg = sen/cos.'],go:()=>showTab('trig')},
 {a:'pre',t:['Trig identities','Identidades trigonométricas'],p:['One identity and two addition formulas carry almost everything.','Una identidad y dos fórmulas de suma lo sostienen casi todo.'],
  f:[['sin²x + cos²x = 1\n1 + tan²x = 1/cos²x\nsin(a ± b) = sin a cos b ± cos a sin b\ncos(a ± b) = cos a cos b ∓ sin a sin b\nsin 2x = 2 sin x cos x\ncos 2x = cos²x − sin²x = 1 − 2sin²x','sen²x + cos²x = 1\n1 + tg²x = 1/cos²x\nsen(a ± b) = sen a cos b ± cos a sen b\ncos(a ± b) = cos a cos b ∓ sen a sen b\nsen 2x = 2 sen x cos x\ncos 2x = cos²x − sen²x = 1 − 2sen²x']],
  k:['Set a = b in the addition formulas to get the double angles. Solve cos 2x = 1 − 2sin²x for sin²x to get the formula you need for ∫sin²x.','Haz a = b en las fórmulas de suma y salen los ángulos dobles. Despeja sen²x de cos 2x = 1 − 2sen²x y tienes lo necesario para ∫sen²x.'],go:()=>showTab('trig')},
 {a:'calc',t:['Limits and notable limits','Límites y límites notables'],p:['Always substitute first. Only an indeterminate form needs real work.','Sustituye siempre primero. Solo una indeterminación necesita trabajo.'],
  f:[['sin u / u → 1          (u → 0)\n(1 − cos u)/u² → 1/2\n(eᵘ − 1)/u → 1\nln(1 + u)/u → 1\n(1 + 1/x)ˣ → e         (x → ∞)\nIndeterminate: 0/0, ∞/∞, ∞−∞, 0·∞, 1^∞, 0⁰, ∞⁰','sen u / u → 1          (u → 0)\n(1 − cos u)/u² → 1/2\n(eᵘ − 1)/u → 1\nln(1 + u)/u → 1\n(1 + 1/x)ˣ → e         (x → ∞)\nIndeterminadas: 0/0, ∞/∞, ∞−∞, 0·∞, 1^∞, 0⁰, ∞⁰']],
  k:['Equivalent infinitesimals as u → 0: sin u ~ tan u ~ ln(1 + u) ~ eᵘ − 1 ~ u. Swap them inside products and quotients.','Infinitésimos equivalentes cuando u → 0: sen u ~ tg u ~ ln(1 + u) ~ eᵘ − 1 ~ u. Sustitúyelos en productos y cocientes.'],go:()=>openLim('sin(x)/x','0')},
 {a:'calc',t:['L’Hôpital and tricks','L’Hôpital y otros recursos'],p:['For 0/0 or ∞/∞, differentiate top and bottom separately (not the quotient rule) and try again.','Para 0/0 o ∞/∞, deriva numerador y denominador por separado (no la regla del cociente) y vuelve a probar.'],
  f:[["lim u/v = lim u′/v′    (0/0 or ∞/∞)\nPolynomials: factor (x − a), Ruffini\nRoots: multiply by the conjugate\nRational at ∞: compare degrees\n1^∞: lim uᵛ = e^(lim v·(u − 1))","lim u/v = lim u′/v′    (0/0 o ∞/∞)\nPolinomios: factor (x − a), Ruffini\nRaíces: multiplica por el conjugado\nRacional en ∞: compara grados\n1^∞: lím uᵛ = e^(lím v·(u − 1))"]],
  k:['1^∞ shortcut: (1 + 3/x)ˣ → e^(lim x·3/x) = e³. Growth at ∞: ln x ≪ xᵖ ≪ aˣ ≪ x! ≪ xˣ.','Atajo 1^∞: (1 + 3/x)ˣ → e^(lím x·3/x) = e³. Crecimiento en ∞: ln x ≪ xᵖ ≪ aˣ ≪ x! ≪ xˣ.'],go:()=>openLim('(1+1/x)^x','inf')},
 {a:'calc',t:['Continuity','Continuidad'],p:['f is continuous at a when f(a) exists, the limit exists, and they are equal. Each failure has a name.','f es continua en a si existe f(a), existe el límite y coinciden. Cada fallo tiene nombre.'],
  f:[['Removable   limit exists, ≠ f(a) or f(a) missing\nJump        left ≠ right, both finite\nInfinite    a side tends to ±∞\nEssential   no side limit (oscillation)','Evitable    existe el límite, ≠ f(a) o no hay f(a)\nSalto       izquierda ≠ derecha, finitos\nInfinita    algún lateral → ±∞\nEsencial    no hay límite lateral (oscila)']],
  k:['Bolzano: continuous on [a, b] with f(a), f(b) of opposite sign ⇒ a root in between. Weierstrass: continuous on [a, b] ⇒ max and min are reached.','Bolzano: continua en [a, b] con f(a) y f(b) de signo opuesto ⇒ hay una raíz entre medias. Weierstrass: continua en [a, b] ⇒ alcanza máximo y mínimo.'],go:()=>openLim('|x|/x','0')},
 {a:'calc',t:['The derivative','La derivada'],p:['The derivative is the limit of secant slopes: the instantaneous rate of change and the slope of the tangent.','La derivada es el límite de las pendientes de las secantes: la tasa instantánea de cambio y la pendiente de la tangente.'],
  f:[["f′(a) = lim (f(a + h) − f(a))/h,  h → 0\ntangent:  y = f(a) + f′(a)(x − a)\nnormal:   y = f(a) − (x − a)/f′(a)","f′(a) = lím (f(a + h) − f(a))/h,  h → 0\ntangente: y = f(a) + f′(a)(x − a)\nnormal:   y = f(a) − (x − a)/f′(a)"]],
  k:['Differentiable ⇒ continuous, never the reverse: |x| is continuous at 0 but has a corner there.','Derivable ⇒ continua, nunca al revés: |x| es continua en 0 pero tiene un pico.'],go:()=>{showTab('lab');LAB.tog.sec=true;labTogs();labAnimDx()}},
 {a:'calc',t:['Derivative rules','Reglas de derivación'],p:['A short table plus three combination rules covers every elementary function.','Una tabla corta y tres reglas de combinación cubren toda función elemental.'],
  f:[["(xⁿ)′ = n·xⁿ⁻¹      (eˣ)′ = eˣ      (aˣ)′ = aˣ ln a\n(ln x)′ = 1/x        (sin x)′ = cos x  (cos x)′ = −sin x\n(tan x)′ = 1/cos²x   (arctan x)′ = 1/(1 + x²)\n(arcsin x)′ = 1/√(1 − x²)\n(uv)′ = u′v + uv′\n(u/v)′ = (u′v − uv′)/v²","(xⁿ)′ = n·xⁿ⁻¹      (eˣ)′ = eˣ      (aˣ)′ = aˣ ln a\n(ln x)′ = 1/x        (sen x)′ = cos x  (cos x)′ = −sen x\n(tg x)′ = 1/cos²x    (arctg x)′ = 1/(1 + x²)\n(arcsen x)′ = 1/√(1 − x²)\n(uv)′ = u′v + uv′\n(u/v)′ = (u′v − uv′)/v²"]],
  k:['Quotient rule order: "low d-high minus high d-low, over low squared". Or skip it: write u/v as u·v⁻¹ and use the product rule.','Orden del cociente: "abajo por la derivada de arriba menos arriba por la derivada de abajo, entre abajo al cuadrado". O evítala: u/v = u·v⁻¹ y regla del producto.'],go:()=>showTab('der')},
 {a:'calc',t:['Chain rule','Regla de la cadena'],p:['For a composition, differentiate the outer layer with the inside untouched, then multiply by the derivative of the inside.','En una composición, deriva la capa exterior dejando el interior intacto y multiplica por la derivada del interior.'],
  f:["(f(g(x)))′ = f′(g(x))·g′(x)\n(sin(x²))′ = cos(x²)·2x\n(e^(3x))′ = 3e^(3x)\n(ln(x² + 1))′ = 2x/(x² + 1)"],
  k:['Peel it like an onion: one layer per factor. ln(u)′ = u′/u and (eᵘ)′ = eᵘ·u′ appear in nearly every exam.','Pélala como una cebolla: un factor por capa. ln(u)′ = u′/u y (eᵘ)′ = eᵘ·u′ salen en casi todos los exámenes.'],go:()=>{DER.f=$('f-der').value='cos(x^2)';showTab('der');derCompute()}},
 {a:'calc',t:['Curve sketching','Representación de funciones'],p:['The signs of f′ and f″ between their zeros give the whole shape.','Los signos de f′ y f″ entre sus ceros dan toda la forma.'],
  f:[["f′ > 0 increasing,  f′ < 0 decreasing\nf′(c) = 0, f″(c) < 0 → local max\nf′(c) = 0, f″(c) > 0 → local min\nf″ changes sign → inflection point\nAsymptotes: vertical (k/0), horizontal (lim at ∞), oblique y = mx + n","f′ > 0 creciente,  f′ < 0 decreciente\nf′(c) = 0, f″(c) < 0 → máximo relativo\nf′(c) = 0, f″(c) > 0 → mínimo relativo\nf″ cambia de signo → punto de inflexión\nAsíntotas: vertical (k/0), horizontal (lím en ∞), oblicua y = mx + n"]],
  k:['Order of work: domain → symmetry → intercepts → asymptotes → f′ table → f″ table → sketch. Oblique: m = lim f(x)/x, n = lim (f(x) − mx).','Orden: dominio → simetría → cortes → asíntotas → tabla de f′ → tabla de f″ → dibujo. Oblicua: m = lím f(x)/x, n = lím (f(x) − mx).'],go:()=>{LAB.f=$('f-lab').value='x^3-3x';labResetT();showTab('lab');labCompute()}},
 {a:'calc',t:['Integral table','Tabla de integrales'],p:['Antiderivatives run the derivative table backwards. Always add + C.','Las primitivas leen la tabla de derivadas al revés. Suma siempre + C.'],
  f:[["∫xⁿ dx = xⁿ⁺¹/(n + 1)     (n ≠ −1)\n∫1/x dx = ln|x|\n∫eˣ dx = eˣ        ∫aˣ dx = aˣ/ln a\n∫sin x dx = −cos x  ∫cos x dx = sin x\n∫1/(1 + x²) dx = arctan x\n∫f(ax + b) dx = F(ax + b)/a","∫xⁿ dx = xⁿ⁺¹/(n + 1)     (n ≠ −1)\n∫1/x dx = ln|x|\n∫eˣ dx = eˣ        ∫aˣ dx = aˣ/ln a\n∫sen x dx = −cos x  ∫cos x dx = sen x\n∫1/(1 + x²) dx = arctg x\n∫f(ax + b) dx = F(ax + b)/a"]],
  k:['Check every antiderivative by differentiating it back. ∫u′/u = ln|u| catches many "hard" quotients: ∫2x/(x² + 1) = ln(x² + 1).','Comprueba cada primitiva derivándola. ∫u′/u = ln|u| resuelve muchos cocientes "difíciles": ∫2x/(x² + 1) = ln(x² + 1).'],go:()=>showTab('int')},
 {a:'calc',t:['Fundamental theorem','Teorema fundamental'],p:['Integration and differentiation undo each other. A definite integral is a limit of Riemann sums and equals F(b) − F(a).','Integrar y derivar son operaciones inversas. La integral definida es el límite de sumas de Riemann y vale F(b) − F(a).'],
  f:[["∫ₐᵇ f dx = lim Σ f(xᵢ*)·Δx,  Δx = (b − a)/n\n∫ₐᵇ f dx = F(b) − F(a)        (Barrow)\nd/dx ∫ₐˣ f(t) dt = f(x)\nd/dx ∫ₐ^g(x) f(t) dt = f(g(x))·g′(x)","∫ₐᵇ f dx = lím Σ f(xᵢ*)·Δx,  Δx = (b − a)/n\n∫ₐᵇ f dx = F(b) − F(a)        (Barrow)\nd/dx ∫ₐˣ f(t) dt = f(x)\nd/dx ∫ₐ^g(x) f(t) dt = f(g(x))·g′(x)"]],
  k:['Area below the axis subtracts. For the geometric area, split at the zeros of f and add absolute values.','El área bajo el eje resta. Para el área geométrica, parte por los ceros de f y suma valores absolutos.'],go:()=>{INT.f=$('f-int').value='x^3-3x';INT.a=$('a-int').value='-2';INT.b=$('b-int').value='2';showTab('int');intCompute(true)}},
 {a:'calc',t:['Parts and substitution','Partes y cambio de variable'],p:['Substitution undoes the chain rule; integration by parts undoes the product rule.','El cambio de variable deshace la regla de la cadena; la integración por partes deshace la del producto.'],
  f:["∫f(g(x))·g′(x) dx = ∫f(u) du,   u = g(x)\n∫u dv = u·v − ∫v du\n∫x·eˣ dx = x·eˣ − eˣ + C"],
  k:['Choosing u: LIATE (Logs, Inverse trig, Algebraic, Trig, Exponential); take u from the left.','«Un día vi una vaca sin cola vestida de uniforme»: ∫u dv = u·v − ∫v du. Para elegir u: ALPES (Arcos, Logaritmos, Polinomios, Exponenciales, Senos y cosenos), de izquierda a derecha.'],go:()=>{INT.f=$('f-int').value='x*e^x';INT.a=$('a-int').value='0';INT.b=$('b-int').value='1';showTab('int');intCompute(true)}},
 {a:'calc',t:['Taylor series','Series de Taylor'],p:['Near a, a smooth function is a polynomial whose coefficients are its derivatives at a, divided by k!.','Cerca de a, una función suave es un polinomio cuyos coeficientes son sus derivadas en a entre k!.'],
  f:[["f(x) = Σ f⁽ᵏ⁾(a)/k! · (x − a)ᵏ\neˣ = 1 + x + x²/2! + x³/3! + …\nsin x = x − x³/3! + x⁵/5! − …\ncos x = 1 − x²/2! + x⁴/4! − …\nln(1 + x) = x − x²/2 + x³/3 − …   (|x| < 1)\n1/(1 − x) = 1 + x + x² + …       (|x| < 1)","f(x) = Σ f⁽ᵏ⁾(a)/k! · (x − a)ᵏ\neˣ = 1 + x + x²/2! + x³/3! + …\nsen x = x − x³/3! + x⁵/5! − …\ncos x = 1 − x²/2! + x⁴/4! − …\nln(1 + x) = x − x²/2 + x³/3 − …   (|x| < 1)\n1/(1 − x) = 1 + x + x² + …       (|x| < 1)"]],
  k:['Substitute instead of differentiating: e^(−x²) = 1 − x² + x⁴/2 − … comes straight from eᵘ with u = −x². Taylor also solves limits: (x − sin x)/x³ → 1/6.','Sustituye en vez de derivar: e^(−x²) = 1 − x² + x⁴/2 − … sale directo de eᵘ con u = −x². Taylor también resuelve límites: (x − sen x)/x³ → 1/6.'],go:()=>showTab('tay')}];

 quad:{area:'pre',name:['Quadratic equations','Ecuaciones de segundo grado'],
  make(){if(Math.random()<0.6){const r1=ri(-6,6);let r2=ri(-6,6);while(r2===r1)r2=ri(-6,6);const a=pick([1,1,2,-1]);return{v:'i',a,r1:Math.min(r1,r2),r2:Math.max(r1,r2)}}let a=pick([1,1,2]),b=ri(-6,6),c=ri(-6,3);while(b*b-4*a*c<=0||isSq(b*b-4*a*c))c=ri(-8,2);return{v:'r',a,b,c}},
  build(p){if(p.v==='i'){const{a,r1,r2}=p;const hi=[a,-a*(r1+r2),a*r1*r2];const r=polySolve({hi,L:1,deg:2});return{prompt:T('Solve (smaller root first).','Resuelve (primero la raíz menor).'),math:`${polyStr(hi)} = 0`,fields:['x₁ =','x₂ ='],ans:[r1,r2],steps:[...r.steps.slice(1),T(`Solutions: x₁ = <b>${r1}</b>, x₂ = <b>${r2}</b>.`,`Soluciones: x₁ = <b>${r1}</b>, x₂ = <b>${r2}</b>.`)],

   const{a,b,c}=p;const hi=[a,b,c];const rs=quadRoots(a,b,c);const r=polySolve({hi,L:1,deg:2});
   return{prompt:T('Give the larger root in exact form (sqrt allowed).','Da la raíz mayor en forma exacta (vale sqrt).'),math:`${polyStr(hi)} = 0`,fields:['x ='],ans:[rs[1].v],steps:[...r.steps.slice(1),T(`Roots: ${rs.map(x=>x.s).join(T(' and ',' y '))}. The larger is <b>${rs[1].s}</b> ≈ ${fmt(rs[1].v,4)}.`,`Raíces: ${rs.map(x=>x.s).join(' y ')}. La mayor es <b>${rs[1].s}</b> ≈ ${fmt(rs[1].v,4)}.`)],

 polyeq:{area:'pre',name:['Polynomial equations','Ecuaciones polinómicas'],
  make(){const s=new Set();while(s.size<3)s.add(ri(-4,4));return{r:[...s].sort((a,b)=>a-b)}},
  build({r}){const[a,b,c]=r;const hi=[1,-(a+b+c),a*b+a*c+b*c,-a*b*c];const fp=factorPoly(hi);

 expeq:{area:'pre',name:['Exponential equations','Ecuaciones exponenciales'],
  make(){const b=pick([2,3]);const e1=ri(0,2);const e2=ri(e1+1,3);return{b,e1,e2}},
  build({b,e1,e2}){const t1=b**e1,t2=b**e2,S_=t1+t2,P=t1*t2;const src=`${b*b}^x-${S_}*${b}^x+${P}=0`;
   return{prompt:T('Solve (smaller solution first).','Resuelve (primero la solución menor).'),math:`${b*b}ˣ − ${S_}·${b}ˣ + ${P} = 0`,fields:['x₁ =','x₂ ='],ans:[e1,e2],
    steps:[T(`${b*b}ˣ = (${b}²)ˣ = (${b}ˣ)². Substitute t = ${b}ˣ:`,`${b*b}ˣ = (${b}²)ˣ = (${b}ˣ)². Cambio t = ${b}ˣ:`)+` <span class="m">t² − ${S_}t + ${P} = 0</span>`,`t = (${S_} ± √(${S_*S_} − ${4*P}))/2 ⇒ t = ${t1}, t = ${t2}`,`${b}ˣ = ${t1} ⇒ x = ${e1};   ${b}ˣ = ${t2} ⇒ x = ${e2}`,T(`Solutions: <b>${e1}</b> and <b>${e2}</b>.`,`Soluciones: <b>${e1}</b> y <b>${e2}</b>.`)],

 logeq:{area:'pre',name:['Logarithmic equations','Ecuaciones logarítmicas'],
  make(){return{t:pick([[2,4,2,3],[2,8,6,4],[2,4,3,2],[2,8,4,5],[3,9,6,3],[3,3,2,1],[10,10,9,1],[10,20,15,2],[2,16,12,6]])}},

 trigeq:{area:'pre',name:['Trig equations','Ecuaciones trigonométricas'],
  make(){for(;;){const fn=pick(['sin','cos','tan']);const d=pick([30,45,60,120,135,150,210,225,240,300,315,330]);const v=Math[fn](rad(d));if(Math.abs(v)>1e3)continue;return{fn,d}}},

   const al=fn==='sin'?deg(Math.asin(v)):fn==='cos'?deg(Math.acos(v)):deg(Math.atan(v));let us=fn==='sin'?[al,180-al]:fn==='cos'?[al,-al]:[al,al+180];us=us.map(u=>Math.round(((u%360)+360)%360)).sort((a,b)=>a-b);

    hints:[T('Find the reference angle from the exact-value table.','Busca el ángulo de referencia en la tabla de valores exactos.'),T('Use the sign of the value to pick the two quadrants.','Usa el signo del valor para elegir los dos cuadrantes.')],
    open:()=>{TRG.teq={fn,k:'1',c:'0',v:String(v)};showTab('trg');trgStatic();['k','c','v'].forEach(k=>$('teq-'+k).value=TRG.teq[k]);trgMode('eq')}}}},

  build(p){const tri=o=>()=>{TRG.tri={a:'',b:'',c:'',A:'',B:'',C:'',...o};showTab('trg');trgStatic();['a','b','c','A','B','C'].forEach(k=>$('tri-'+k).value=TRG.tri[k]);trgMode('tri')};

   const L_=[['1+i',[1,1],45],['-1+i',[-1,1],135],['sqrt(3)+i',[Math.sqrt(3),1],30],['1-sqrt(3)i',[1,-Math.sqrt(3)],-60],['-1-i',[-1,-1],-135],['-sqrt(3)+i',[-Math.sqrt(3),1],150],['2i',[0,2],90],['-3',[-3,0],180]][p.i];

const OPSHOW={'<':'<','>':'>','<=':'≤','>=':'≥','=':'=','!=':'≠'};
function solveASTeq(L,R){let r=null;try{r=solveEq(L,R)}catch(e){r=null}const Lf=cmp(L),Rf=cmp(R);const out=[];
 const add=(v,s)=>{if(!isFinite(v)||out.some(o=>Math.abs(o.v-v)<1e-7))return;let a,b;try{a=Lf(v);b=Rf(v)}catch(e){return}if(isFinite(a)&&isFinite(b)&&Math.abs(a-b)<=1e-7*Math.max(1,Math.abs(a),Math.abs(b)))out.push({v,s})};
 if(r&&!r.all)r.sols.forEach(s=>add(s.v,s.s));
 const g=x=>Lf(x)-Rf(x);roots(g,-60,60,6000).concat(roots(g,-8,8,4000)).forEach(v=>add(v,niceVal(v)||fmt(v,5)));
 return{pts:out,all:r&&r.all,exact:!!r}}
function parseIneq(src){const s=src.replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/=>/g,'>=').replace(/=</g,'<=').replace(/≠/g,'!=');
 const parts=s.split(/(<=|>=|!=|<|>|=)/);
 if(parts.length===3){const L=parse(parts[0]),R=parse(parts[2]);if(!hasX(L)&&!hasX(R))throw PErr('The inequality needs an x','La inecuación necesita una x');return[{L,R,op:parts[1]}]}
 if(parts.length===5&&parts[1]!=='='&&parts[3]!=='='){const a=parse(parts[0]),b=parse(parts[2]),c=parse(parts[4]);return[{L:a,R:b,op:parts[1]},{L:b,R:c,op:parts[3]}]}
 throw PErr('Write one relation like 2x-3<5, or a double one like 1<2x-3<=5','Escribe una relación como 2x-3<5, o una doble como 1<2x-3<=5')}
function holds(c,x){let a,b;try{a=cmp(c.L)(x);b=cmp(c.R)(x)}catch(e){return null}if(!isFinite(a)||!isFinite(b))return null;const g=a-b,E=1e-9*Math.max(1,Math.abs(a),Math.abs(b));
 switch(c.op){case '<':return g<-E;case '>':return g>E;case '<=':return g<=E;case '>=':return g>=-E;case '=':return Math.abs(g)<=E;case '!=':return Math.abs(g)>E}}
function domainPts(n,acc){if(n.t==='/'&&hasX(n.b))acc.push({u:n.b,why:'den'});if(n.t==='f'&&['ln','log','sqrt'].includes(n.f))acc.push({u:n.a,why:n.f});if(n.t==='^'&&hasX(n.a)&&!hasX(n.b)){const k=ev(n.b,0);if(!Number.isInteger(k))acc.push({u:n.a,why:'sqrt'})}if(n.a)domainPts(n.a,acc);if(n.b)domainPts(n.b,acc);return acc}
function factorsOf(G){const rows=[];const add=(lab,f,den)=>rows.push({lab,f,den});
 const fromPoly=(node,den)=>{const pc=polyCo(node);if(!pc||!pc.int||pc.deg<1||pc.deg>8)return false;const fp=factorPoly(pc.hi,pc.L);
  let c=pc.hi.reduce((a,b)=>gcd(a,b),0);if(pc.hi[0]<0)c=-c;if(c<0)add(fmtI(c),()=>c,den);if(fp.k)add(fp.k>1?'x'+sup(fp.k):'x',x=>Math.pow(x,fp.k),den);
  fp.lin.forEach(l=>add(powS(linF(l.p,l.q),l.m),x=>Math.pow(l.q*x-l.p,l.m),den));fp.quads.forEach(q=>add(`(${polyStr(q)})`,x=>q[0]*x*x+q[1]*x+q[2],den));fp.others.forEach(o=>add(`(${polyStr(o)})`,x=>o.reduce((s,v)=>s*x+v,0),den));return true};
 if(polyCo(G)&&polyCo(G).int){fromPoly(G,false);return rows}
 if(G.t==='/'){const ok1=fromPoly(G.a,false),ok2=ok1&&fromPoly(G.b,true);if(ok1&&ok2)return rows}
 return[]}
function solveIneq(src){const conds=parseIneq(src);const st=[];
 // narrative
 const c0=conds[0];
 if(conds.length===2)st.push(T(`<b>Double inequality</b>: both ${esc(str(simp(conds[0].L)))} ${OPSHOW[conds[0].op]} ${esc(str(simp(conds[0].R)))} and ${esc(str(simp(conds[1].L)))} ${OPSHOW[conds[1].op]} ${esc(str(simp(conds[1].R)))} must hold. Solve them together and intersect.`,`<b>Inecuación doble</b>: deben cumplirse a la vez ${esc(str(simp(conds[0].L)))} ${OPSHOW[conds[0].op]} ${esc(str(simp(conds[0].R)))} y ${esc(str(simp(conds[1].L)))} ${OPSHOW[conds[1].op]} ${esc(str(simp(conds[1].R)))}. Se resuelven juntas y se intersecan.`));
 if(conds.length===1){let L=simp(c0.L),R=simp(c0.R),op=c0.op;if(!hasX(L)&&hasX(R)){[L,R]=[R,L];op={'<':'>','>':'<','<=':'>=','>=':'<=','=':'=','!=':'!='}[op]}
  if(L.t==='f'&&L.f==='abs'&&!hasX(R)){const k=ev(R,0),u=esc(str(L.a)),ks=esc(str(R));
   if(op==='<'||op==='<=')st.push(k<0||(k===0&&op==='<')?T(`|u| is never negative, so |u| ${OPSHOW[op]} ${ks} has <b>no solution</b>.`,`|u| nunca es negativo, así que |u| ${OPSHOW[op]} ${ks} <b>no tiene solución</b>.`):T(`<b>Absolute value rule</b>: |u| ${OPSHOW[op]} k ⇔ −k ${OPSHOW[op]} u ${OPSHOW[op]} k. Here: −${ks} ${OPSHOW[op]} ${u} ${OPSHOW[op]} ${ks} (distance to 0 at most k).`,`<b>Regla del valor absoluto</b>: |u| ${OPSHOW[op]} k ⇔ −k ${OPSHOW[op]} u ${OPSHOW[op]} k. Aquí: −${ks} ${OPSHOW[op]} ${u} ${OPSHOW[op]} ${ks} (distancia a 0 como mucho k).`));
   else if(op==='>'||op==='>=')st.push(k<0||(k===0&&op==='>=')?T(`|u| ≥ 0 always, so every x in the domain works.`,`|u| ≥ 0 siempre, así que vale todo x del dominio.`):T(`<b>Absolute value rule</b>: |u| ${OPSHOW[op]} k ⇔ u ${op==='>'?'<':'≤'} −k or u ${OPSHOW[op]} k. Here: ${u} ${op==='>'?'<':'≤'} −${ks} or ${u} ${OPSHOW[op]} ${ks} (two rays).`,`<b>Regla del valor absoluto</b>: |u| ${OPSHOW[op]} k ⇔ u ${op==='>'?'<':'≤'} −k o u ${OPSHOW[op]} k. Aquí: ${u} ${op==='>'?'<':'≤'} −${ks} o ${u} ${OPSHOW[op]} ${ks} (dos semirrectas).`));
   else if(op==='=')st.push(k<0?T('|u| = negative number: no solution.','|u| = número negativo: no hay solución.'):T(`|u| = k ⇔ u = k or u = −k: ${u} = ${ks} or ${u} = −${ks}.`,`|u| = k ⇔ u = k o u = −k: ${u} = ${ks} o ${u} = −${ks}.`))}
  else if(/\|/.test(str(L)+str(R)))st.push(T('With absolute values on both sides or an x outside, split by cases where each |u| changes sign (u = 0), or find where both sides are equal and test each interval. Here: equal points first, then a sign table.','Con valores absolutos en ambos lados o una x fuera, separa por casos donde cada |u| cambia de signo (u = 0), o busca dónde los dos lados son iguales y prueba cada intervalo. Aquí: primero los puntos de igualdad, luego una tabla de signos.'));
  const G=simp(B('-',L,R));const pc=polyCo(G);
  if(pc&&pc.int&&pc.deg===1&&op!=='='){const m=pc.hi[0]/pc.L,b=pc.hi[1]/pc.L;const nop=m<0?{'<':'>','>':'<','<=':'>=','>=':'<=','!=':'!='}[op]:op;
   st.push(T(`<b>Linear</b>: move everything to one side: ${fr(m)}x ${b<0?'−':'+'} ${fr(Math.abs(b))} ${OPSHOW[op]} 0.`,`<b>Lineal</b>: todo a un lado: ${fr(m)}x ${b<0?'−':'+'} ${fr(Math.abs(b))} ${OPSHOW[op]} 0.`));
   st.push(m<0?T(`Divide by ${fr(m)}, a <b>negative</b> number, so the inequality <b>flips</b>: x ${OPSHOW[nop]} ${fr(-b/m)}.`,`Divide entre ${fr(m)}, un número <b>negativo</b>, así que la desigualdad <b>cambia de sentido</b>: x ${OPSHOW[nop]} ${fr(-b/m)}.`):T(`Divide by ${fr(m)} (positive, the sign stays): x ${OPSHOW[nop]} ${fr(-b/m)}.`,`Divide entre ${fr(m)} (positivo, el sentido se mantiene): x ${OPSHOW[nop]} ${fr(-b/m)}.`))}
  else if(op!=='=')st.push(T(`Move everything to one side and compare with 0: <span class="m">${esc(str(G))} ${OPSHOW[op]} 0</span>. The sign can only change at zeros or where the expression is undefined.`,`Pasa todo a un lado y compara con 0: <span class="m">${esc(str(G))} ${OPSHOW[op]} 0</span>. El signo solo puede cambiar en los ceros o donde la expresión no está definida.`))}
 // critical points
 let pts=[];const addP=(v,s,kind)=>{if(!isFinite(v))return;const e=pts.find(p=>Math.abs(p.v-v)<1e-7);if(e){if(kind==='den')e.kind='den';if(e.num&&s&&!/e[−+]?\d/.test(s)){e.s=s;e.num=false}return}pts.push({v,s:s||(niceVal(v)||fmt(v,5)),kind,num:!s})};
 conds.forEach(c=>{const z=solveASTeq(c.L,c.R);z.pts.forEach(p=>addP(p.v,p.s,'zero'));
  domainPts(c.L,[]).concat(domainPts(c.R,[])).forEach(d=>{const z2=solveASTeq(d.u,N(0));z2.pts.forEach(p=>addP(p.v,p.s,d.why==='den'?'den':'dom'))})});
 // numeric safety net: definedness changes
 const defAll=x=>conds.every(c=>holds(c,x)!==null);let px=-60,pd=defAll(px);for(let i=1;i<=6000;i++){const x=-60+120*i/6000,d=defAll(x);if(d!==pd){let a=px,b=x;for(let k=0;k<60;k++){const m=(a+b)/2;if(defAll(m)===pd)a=m;else b=m}const r=(a+b)/2;addP(Math.abs(r-Math.round(r))<1e-7?Math.round(r):r,null,'dom')}px=x;pd=d}
 pts.sort((a,b)=>a.v-b.v);
 // elements
 const E=[];const test=(lo,hi)=>lo===-Infinity&&hi===Infinity?0:lo===-Infinity?hi-Math.max(1,Math.abs(hi)):hi===Infinity?lo+Math.max(1,Math.abs(lo)):(lo+hi)/2;
 const satAt=x=>{const r=conds.map(c=>holds(c,x));return r.every(v=>v===true)?true:r.some(v=>v===null)?null:false};
 for(let i=0;i<=pts.length;i++){const lo=i?pts[i-1].v:-Infinity,hi=i<pts.length?pts[i].v:Infinity;const t=test(lo,hi);E.push({t:'I',lo,hi,x:t,sat:satAt(t)===true,def:satAt(t)!==null});if(i<pts.length)E.push({t:'P',p:pts[i],sat:satAt(pts[i].v)===true,def:satAt(pts[i].v)!==null})}
 // runs
 const segs=[];for(let i=0;i<E.length;i++){if(!E[i].sat)continue;let j=i;while(j+1<E.length&&E[j+1].sat)j++;const s=E[i],e=E[j];
  const left=s.t==='P'?{v:s.p.v,s:s.p.s,c:true}:{v:s.lo,s:s.lo===-Infinity?'−∞':pts[i/2-1].s,c:false};const right=e.t==='P'?{v:e.p.v,s:e.p.s,c:true}:{v:e.hi,s:e.hi===Infinity?'+∞':pts[j/2].s,c:false};segs.push({l:left,r:right,pt:i===j&&s.t==='P'});i=j}
 const setStr=segs.length&&segs.every(g=>g.pt)?'{'+segs.map(g=>g.l.s).join(', ')+'}':segs.length?segs.map(g=>g.pt?`{${g.l.s}}`:g.l.v===-Infinity&&g.r.v===Infinity?'ℝ':`${g.l.c?'[':'('}${g.l.s}, ${g.r.s}${g.r.c?']':')'}`).join(' ∪ '):'∅';
 // sign table
 const single=conds.length===1?conds[0]:null;const G=single?simp(B('-',single.L,single.R)):null;const rows=G?factorsOf(G):[];
 return{conds,pts,E,segs,setStr,st,rows,G}}
function signTableHTML(R){const{pts,E,rows,G,conds}=R;if(!pts.length&&!rows.length)return'';
 const sg=v=>v===null||!isFinite(v)?'<span class="small">∄</span>':Math.abs(v)<1e-9?'<b>0</b>':v>0?'<span style="color:var(--ok)">+</span>':'<span style="color:var(--bad)">−</span>';
 const head=E.map(e=>e.t==='I'?`<th>${e.lo===-Infinity?'−∞':''}…${e.hi===Infinity?'+∞':''}</th>`:`<th style="color:var(--accent)">${esc(e.p.s)}</th>`).join('');
